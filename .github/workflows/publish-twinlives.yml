# Publishes this fork's `vico:compose` to the repository's own GitHub Packages Maven registry.
#
# Upstream's `publish.yml` handles Maven Central releases and is inert here — it is guarded on
# `github.repository == 'patrykandpatrick/vico'`. This workflow is the fork's equivalent and
# carries the mirror-image guard, so it stays inert in any fork of the fork.
#
# The iOS klibs build on Linux: `kotlin.native.enableKlibsCrossCompilation` is set in
# gradle.properties, which is how upstream publishes Apple targets from an Ubuntu runner too.
name: Publish to GitHub Packages
# Deliberately manual. A `push` trigger on Versions.kt was tried and removed: the commit that
# added this workflow also changed that file, so pushing it published on its own, and a manual
# run started alongside raced it. A released version in GitHub Packages cannot be overwritten, so
# the second uploader gets a 409 and can leave a version half-written. Publishing is rare enough
# that a deliberate click costs nothing.
on:
  workflow_dispatch:
# Belt and braces: never let two publishes overlap, whatever starts them.
concurrency:
  group: publish-twinlives
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.repository == 'twinlives/vico'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      # Fail in seconds rather than after a five-minute build. A released version cannot be
      # overwritten, so re-running without bumping TWINLIVES can only end in 409.
      - name: Resolve the version and check it is free
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VICO=$(grep -oP '(?<=const val VICO = ")[^"]*' buildSrc/src/main/kotlin/Versions.kt)
          TWINLIVES=$(grep -oP '(?<=const val TWINLIVES = ")[^"]*' buildSrc/src/main/kotlin/Versions.kt)
          VERSION="$VICO-$TWINLIVES"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Publishing com.twinlives.vico:compose:$VERSION" >> "$GITHUB_STEP_SUMMARY"
          BASE=https://maven.pkg.github.com/twinlives/vico/com/twinlives/vico
          code=$(curl -s -o /dev/null -w '%{http_code}' -u "x:$GITHUB_TOKEN" \
            "$BASE/compose/$VERSION/compose-$VERSION.module")
          if [ "$code" = "200" ]; then
            echo "::error::$VERSION is already published. Bump TWINLIVES in Versions.kt."
            exit 1
          fi

      - run: ./gradlew :vico:compose:publishAllPublicationsToGitHubPackagesRepository
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A partially published version is the bad outcome: it resolves on one platform and fails
      # at link time on another. Every target gets a `.module`, so checking those proves the set
      # is whole.
      - name: Verify every target variant landed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BASE=https://maven.pkg.github.com/twinlives/vico/com/twinlives/vico
          missing=0
          for a in compose compose-android compose-iosarm64 compose-iossimulatorarm64 \
                   compose-desktop compose-js compose-wasm-js; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -u "x:$GITHUB_TOKEN" \
              "$BASE/$a/$VERSION/$a-$VERSION.module")
            echo "  $a: HTTP $code" >> "$GITHUB_STEP_SUMMARY"
            [ "$code" = "200" ] || { echo "::error::$a is missing from $VERSION"; missing=1; }
          done
          exit $missing
